name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm --workspace examples/docs run build:pages

      - name: Build example gallery
        run: npm --workspace examples/basic run build:pages

      - name: Build System Pulse
        run: npm --workspace examples/system-pulse run build:pages

      - name: Assemble Pages artifact
        run: |
          mkdir -p pages-dist
          cp -R examples/docs/dist/. pages-dist/
          mkdir -p pages-dist/system-pulse
          mkdir -p pages-dist/examples
          cp -R examples/basic/dist/. pages-dist/examples/
          cp -R examples/system-pulse/dist/. pages-dist/system-pulse/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
